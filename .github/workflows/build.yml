name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar sitio
        run: npm run build

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
